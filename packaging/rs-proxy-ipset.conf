[Service]
# Required systemd drop-in for `[ipset] enabled = true`. CAP_NET_ADMIN is broad:
# it permits snapshot reads and the strict modes' lifecycle-owned Netfilter rules.
# Do not install this file when source admission is disabled.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN

# ProtectSystem=strict makes the shared /run directory read-only. Keep the
# xtables coordination file in the service-owned runtime directory instead.
Environment=XTABLES_LOCKFILE=/run/rs-proxy/xtables.lock
