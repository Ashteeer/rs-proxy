# DNS servers that return the real destination addresses. Use servers
# reachable from this host which do not apply your clients' DNS overrides.
[dns]
servers = ["1.1.1.1:53", "9.9.9.9:53"]

# Start with a local HTTPS test. To serve other machines, bind to the proxy's
# LAN address and restrict access to trusted clients in your firewall.
# The proxy connects to the destination on the same port as this listener.
[[listeners]]
protocol = "tcp"
listen = "127.0.0.1:443"

# For plaintext HTTP on port 80, add another listener:
# [[listeners]]
# protocol = "tcp"
# listen = "127.0.0.1:80"

# For QUIC v1/v2, add a UDP listener on the address used for HTTPS:
# [[listeners]]
# protocol = "udp"
# listen = "127.0.0.1:443"

# Optional client filtering. Name an existing hash:ip set for each family
# you want to filter. Clients from a family with no set can connect normally.
[ipset]
enabled = false
# ipv4_set = "dns_clients"
# ipv6_set = "dns_clients_v6"
# Applies to clients absent from a configured set: silent, reject, first_response, allow.
not_found = "silent"

# Destination checks block private and other reserved addresses by default.
# If you run a private upstream, allow its trusted IP with a narrow CIDR.
# [routing]
# allow_upstream_cidrs = ["10.0.0.20/32"]

# Logs go to journald when running under systemd. Use "debug" to see why
# the proxy declined to route a connection.
# [server]
# log_level = "info"
